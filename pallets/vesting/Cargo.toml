[package]
authors.workspace = true
description = "FRAME vesting pallet (Quantus fork: unlocks against wall-clock time via TimeProvider)"
edition.workspace = true
homepage.workspace = true
license = "Apache-2.0"
name = "pallet-vesting"
readme = "README.md"
repository.workspace = true
version = "45.0.0"

# Vendored upstream FRAME pallet: the pallet macros expand to expect/unwrap, so
# we deliberately don't apply the workspace restriction lints here.

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
frame-benchmarking = { optional = true, workspace = true }
frame-support.workspace = true
frame-system.workspace = true
log = { workspace = true }
# Only used by benchmarks to move the clock forward; the pallet itself is generic
# over `Config::TimeProvider`.
pallet-timestamp = { optional = true, workspace = true }
scale-info = { features = ["derive"], workspace = true }
sp-runtime.workspace = true

[dev-dependencies]
pallet-balances = { workspace = true, default-features = true }
pallet-timestamp = { workspace = true, default-features = true }
sp-io = { workspace = true, default-features = true }

[features]
default = ["std"]
runtime-benchmarks = [
	"dep:pallet-timestamp",
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"pallet-timestamp/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"log/std",
	"pallet-timestamp?/std",
	"scale-info/std",
	"sp-runtime/std",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"sp-runtime/try-runtime",
]
